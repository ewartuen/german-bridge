<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">德國橋牌智能計分板</title>
    <meta name="description" content="德國橋牌智能計分板，支援動態座位、規則防錯、QR 唯讀同步與 Excel 匯出。">
    <meta name="keywords" content="德國橋牌計分, 橋牌計分板, 德國橋牌, German Bridge, QR Code, 自動存檔">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: #2c2c2c;
            --success: #03dac6;
            --error: #cf6679;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-size: 16px;
            padding-bottom: 30px;
        }

        header {
            background-color: var(--surface);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            max-width: 1400px;
            margin: 0 auto 10px auto;
            width: 100%;
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 13px;
            margin-left: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .lang-btn:hover {
            background-color: rgba(187, 134, 252, 0.1);
        }

        .lang-btn.active {
            background-color: var(--primary);
            color: #000;
            font-weight: bold;
        }

        .role-banner {
            background: #332b15;
            color: #f1c40f;
            font-size: 12px;
            text-align: center;
            padding: 6px;
            font-weight: bold;
        }

        .gb-doc-section {
            max-width: 1400px;
            width: calc(100% - 32px);
            margin: 20px auto 30px auto;
            padding: 10px 20px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            color: var(--text-main);
            text-align: left;
            -webkit-user-select: text;
            user-select: text;
        }

        .gb-details {
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
        }

        .gb-details:last-child {
            border-bottom: none;
        }

        .gb-summary {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            outline: none;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .gb-summary::-webkit-details-marker {
            display: none;
        }

        .gb-summary::after {
            content: '＋';
            font-size: 14px;
            color: var(--primary);
            transition: transform 0.2s ease;
        }

        .gb-details[open] .gb-summary::after {
            content: '－';
        }

        .gb-details-content {
            padding-top: 12px;
            font-size: 13.5px;
            line-height: 1.6;
        }

        .gb-details-content h3 {
            font-size: 14px;
            color: var(--text-main);
            margin: 14px 0 6px 0;
            font-weight: bold;
        }

        .gb-details-content p,
        .gb-details-content li {
            color: var(--text-muted);
            font-size: 13.5px;
            margin-bottom: 6px;
        }

        .gb-details-content ul {
            padding-left: 20px;
            margin-top: 4px;
            margin-bottom: 10px;
        }

        .nav-tabs {
            display: flex;
            background-color: var(--surface);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 0;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }

        .tab-btn.active {
            color: var(--primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--primary);
        }

        .main-container {
            padding: 16px;
            display: block;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .setup-card {
            background: var(--surface);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        select,
        input[type="text"],
        input[type="number"].setup-input {
            width: 100%;
            background: #2d2d2d;
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .names-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .round-title {
            font-size: 22px;
            font-weight: bold;
        }

        .dealer-tip {
            font-size: 14px;
            color: var(--success);
            background: rgba(3, 218, 198, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        .player-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .player-label.dealer-highlight {
            color: var(--success);
            font-weight: bold;
        }

        .player-label.screw-highlight-txt {
            color: #f1c40f;
            font-weight: bold;
        }

        input[type="number"].mobile-input {
            width: 100%;
            background: #252525;
            border: 1px solid var(--border);
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
        }

        input[type="number"].dealer-border {
            border-color: var(--success) !important;
            background: #162a27;
        }

        input[type="number"].screw-highlight {
            border-color: #f1c40f !important;
            background: #332b15;
        }

        .action-btn {
            width: 100%;
            background-color: var(--primary);
            color: #000;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px 0;
        }

        .action-btn:disabled {
            background-color: #444;
            color: #888;
        }

        .action-btn.btn-secondary {
            background-color: #333;
            color: #fff;
            border: 1px solid #444;
        }

        .action-btn.btn-warning {
            background-color: #f39c12;
            color: #000;
        }

        .action-btn.btn-danger {
            background-color: #e74c3c;
            color: #fff;
        }

        .action-btn.btn-success {
            background-color: var(--success);
            color: #000;
        }

        .table-responsive-wrapper {
            width: 100%;
            overflow-x: auto;
            max-height: 75vh;
        }

        .score-board-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: center;
        }

        .score-board-table th {
            position: sticky;
            top: 0;
            background: #1e1e1e;
            color: var(--text-muted);
            padding: 14px 6px;
            font-size: 13px;
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }

        .score-board-table td {
            padding: 14px 4px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .edit-round-btn {
            background: #333;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 4px;
        }

        .manage-box {
            background: #1a1a1a;
            border: 1px dashed var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0 15px 0;
            display: none;
        }

        .drag-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
        }

        .drag-item {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #2d2d2d;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .drag-item input[type="text"] {
            flex: 1;
            min-width: 0;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .seat-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-p-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
        }

        .modal-content {
            background: var(--surface);
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        #qrcode-box {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        @media (min-width: 850px) {
            .nav-tabs {
                display: none !important;
            }

            .main-container {
                display: flex;
                gap: 25px;
                max-width: 1400px;
                margin: 0 auto;
                padding: 25px;
            }

            .panel {
                display: block !important;
                flex: 1;
                background: var(--surface);
                padding: 25px;
                border-radius: 12px;
            }

            #input-panel {
                flex: 1.2;
            }

            #board-panel {
                flex: 1.8;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="lang-switcher">
            <button id="btn-en" class="lang-btn" onclick="switchGlobalLanguage('en')">English</button>
            <button id="btn-zh-HK" class="lang-btn" onclick="switchGlobalLanguage('zh-HK')">Traditional Chinese</button>
            <button id="btn-zh-CN" class="lang-btn" onclick="switchGlobalLanguage('zh-CN')">Simplified Chinese</button>
        </div>
        <h1 id="main-heading">German Bridge Scoring System</h1>
    </header>
    <div id="role-notice" class="role-banner">🔑 Role: Admin mode (can input / modify scores)</div>

    <div class="nav-tabs">
        <button class="tab-btn active" id="btn-input" onclick="switchTab('input-panel')">Input</button>
        <button class="tab-btn" id="btn-board" onclick="switchTab('board-panel')">Scoreboard</button>
    </div>

    <div class="main-container">
        <!-- 輸入面板 -->
        <div id="input-panel" class="panel active">
            <div class="setup-card" id="setup-area">
                <div class="form-group">
                    <label id="label-player-count">選擇人數</label>
                    <input type="number" id="player-count" class="setup-input" value="4" min="2" max="52"
                        oninput="initPlayerInputs()">
                </div>
                <label id="label-names-help">玩家名字 (順時針座位)</label>
                <div class="names-grid" id="names-fields-box"></div>
                <button class="action-btn" id="btn-create-game" onclick="startNewGame()">建立新對局</button>
            </div>

            <div id="game-play-area" style="display: none;">
                <div class="game-header">
                    <div class="round-title" id="display-round-title">局 1</div>
                    <div class="dealer-tip" id="display-dealer-name">👑 莊家: --</div>
                </div>

                <button class="action-btn btn-secondary" id="btn-toggle-manage" onclick="toggleManagePlayers()">👥
                    調整玩家次序 / 改名</button>
                <div id="manage-players-box" class="manage-box">
                    <h3 id="manage-title" style="font-size:14px; color:var(--primary);">管理玩家（改名、上下移動座位；完成一局後亦可重排）</h3>
                    <p id="manage-help" style="font-size:12px; color:var(--text-muted); margin:8px 0 0;">
                        座位由上至下為順時針順序。改名唔會清分數；調位會跟住人一齊搬分數。</p>
                    <div class="drag-list" id="manage-drag-list"></div>
                    <div style="display:flex; gap:8px; margin-top:10px;">
                        <input type="text" id="new-player-name" placeholder="輸入新玩家名字"
                            style="flex:1; padding:10px; background:#2d2d2d; border:1px solid var(--border); color:#fff; border-radius:6px; font-size:14px;">
                        <button class="action-btn" id="btn-add-player" style="width:auto; margin:0; padding:10px 14px;"
                            onclick="addNewPlayer()">➕ 新增</button>
                    </div>
                </div>

                <div id="section-bid">
                    <div id="bid-label-wrap" style="color:var(--text-muted); font-size:14px; margin-bottom:8px;">預計取得墩數
                        (報墩) <span id="bid-hint" style="font-size:12px; color:#aaa;">(未填寫預設為 0)</span></div>
                    <div class="inputs-grid" id="grid-bid-inputs"></div>
                    <button class="action-btn" id="btn-start-round" onclick="lockBids()">鎖定報墩並開始</button>
                </div>

                <div id="section-result" style="opacity: 0.4; pointer-events: none;">
                    <div id="result-label-wrap" style="color:var(--text-muted); font-size:14px; margin-bottom:8px;">
                        實際贏取墩數 (勝墩) <span id="result-hint" style="font-size:12px; color:#aaa;">(未填寫預設為 0)</span></div>
                    <div class="inputs-grid" id="grid-result-inputs"></div>
                    <button class="action-btn" id="btn-end-round" onclick="submitResults()" disabled>結束本局並結算</button>
                </div>

                <div style="display:flex; gap:8px; margin-top:10px;">
                    <button class="action-btn btn-warning" id="btn-reset-round" style="flex:1;"
                        onclick="resetCurrentRound()">↩️ 重設本局輸入</button>
                    <button class="action-btn btn-danger" id="btn-reset-scores" style="flex:1;"
                        onclick="restartEntireGame()">🧹 清空分數重開新局</button>
                </div>
            </div>
        </div>

        <!-- 積分板面板 -->
        <div id="board-panel" class="panel">
            <div id="admin-tools" style="margin-bottom:12px; display:flex; gap:8px; flex-wrap:wrap;">
                <button id="qr-btn" class="action-btn btn-secondary"
                    style="padding:10px; font-size:13px; margin:0; flex:1;" onclick="showQRCodeModal()">📱 顯示唯讀 QR
                    Code</button>
                <button id="copy-link-btn" class="action-btn btn-secondary"
                    style="padding:10px; font-size:13px; margin:0; flex:1;" onclick="copyReadOnlyLink()">🔗
                    複製唯讀連結</button>
            </div>
            <div id="export-tools" style="margin-bottom:12px;">
                <button id="btn-export" class="action-btn btn-success" style="padding:10px; font-size:13px; margin:0;"
                    onclick="exportToExcel()">📊 匯出 Excel 檔</button>
            </div>
            <div class="table-responsive-wrapper">
                <table class="score-board-table">
                    <thead>
                        <tr id="board-th-row">
                            <th style="width:50px;">局</th>
                        </tr>
                    </thead>
                    <tbody id="board-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <section class="gb-doc-section" id="about-doc-section"></section>

    <!-- 修改分數 Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3 id="edit-modal-title" style="margin-bottom:15px; color:var(--primary);">修改記錄</h3>
            <div id="modal-inputs-area"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button id="save-edit-btn" class="action-btn btn-success" style="margin:0;"
                    onclick="saveEditedRound()">儲存變更並重算</button>
                <button id="cancel-edit-btn" class="action-btn btn-secondary" style="margin:0;"
                    onclick="closeEditModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qr-modal" class="modal">
        <div class="modal-content">
            <h3 id="qr-title" style="color:var(--primary);">玩家唯讀觀看 QR Code</h3>
            <p id="qr-help" style="font-size:12px; color:var(--text-muted); margin-top:5px;">
                請確保房主手機網頁開著。玩家掃描一次後即可連線，重開新局也無需重新掃描。</p>
            <div id="qrcode-box"></div>
            <button id="qr-close-btn" class="action-btn btn-secondary" style="margin:0;"
                onclick="closeQRModal()">關閉</button>
        </div>
    </div>

        const STORAGE_KEY = 'german_bridge_state_v1';

        function saveGameState() {
            const payload = {
                pCount: pCount,
                currentRound: currentRound,
                initialPlayers: initialPlayers,
                sortedOrder: sortedOrder,
                scoresHistory: scoresHistory,
                currentLang: currentLang
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        }

        function loadGameState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return false;

                const state = JSON.parse(raw);
                if (!state || !Array.isArray(state.initialPlayers) || !state.initialPlayers.length) return false;

                pCount = Number(state.pCount) || state.initialPlayers.length;
                currentRound = Number(state.currentRound) || 1;
                initialPlayers = state.initialPlayers;
                sortedOrder = Array.isArray(state.sortedOrder) && state.sortedOrder.length ? state.sortedOrder : [...Array(pCount).keys()];
                scoresHistory = Array.isArray(state.scoresHistory) ? state.scoresHistory : [];
                if (state.currentLang && translations[state.currentLang]) {
                    currentLang = state.currentLang;
                }

                const playerCountSelect = document.getElementById('player-count');
                if (playerCountSelect) playerCountSelect.value = String(pCount);

                document.getElementById('setup-area').style.display = 'none';
                document.getElementById('game-play-area').style.display = 'block';
                return true;
            } catch (err) {
                console.error('Load game state failed:', err);
                return false;
            }
        }

        window.onload = function () {
            const savedLang = localStorage.getItem('gb-preferred-lang');
            if (savedLang && translations[savedLang]) currentLang = savedLang;

            const restored = loadGameState();
            if (!restored) {
                initPlayerInputs();
            } else {
                const countSelect = document.getElementById('player-count');
                if (countSelect) countSelect.value = String(pCount);
            }

            switchGlobalLanguage(currentLang);
            checkModeUI();

            if (restored && initialPlayers.length > 0) {
                renderScoreBoard();
                if (scoresHistory.length > 0) {
                    recalculateAllScores();
                }
            }

            if (isReadOnly && hostPeerId) {
                initClientP2P(hostPeerId);
            } else {
                initHostP2P();
            }
        };

        function initHostP2P() {
            const peerConfig = {
                host: '0.peerjs.com',
                port: 443,
                secure: true,
                debug: 2
            };

            if (peer) {
                peer.destroy();
            }

            peer = new Peer(peerConfig);

            peer.on('open', (id) => {
                console.log('P2P Room ID established:', id);
                peerRetryCount = 0;
            });

            peer.on('connection', (conn) => {
                connections.push(conn);
                conn.on('open', () => broadcastData());
            });

            peer.on('error', (err) => {
                console.error('PeerJS Connection Error:', err);
                const retryableTypes = ['disconnected', 'network', 'server-error', 'peer-unavailable'];
                const t = translations[currentLang] || translations['zh-HK'];

                if (retryableTypes.includes(err.type) && peerRetryCount < 2) {
                    peerRetryCount += 1;
                    console.warn(`Retrying PeerJS host setup (${peerRetryCount}/2) after error:`, err.type);
                    setTimeout(() => initHostP2P(), 1500);
                    return;
                }

                const message = t.peerError.replace('{type}', err.type || 'unknown');
                alert(message);
            });
        }

        function initClientP2P(targetHostId) {
            peer = new Peer();
            peer.on('open', () => {
                hostConn = peer.connect(targetHostId);
                hostConn.on('data', (data) => {
                    pCount = data.pCount;
                    currentRound = data.currentRound;
                    initialPlayers = data.initialPlayers;
                    sortedOrder = data.sortedOrder;
                    scoresHistory = data.scoresHistory || [];

                    document.getElementById('setup-area').style.display = 'none';
                    document.getElementById('game-play-area').style.display = 'block';
                    renderScoreBoard();
                });
            });
        }

        function broadcastData() {
            if (isReadOnly || !connections.length) return;
            const payload = {
                pCount: pCount,
                currentRound: currentRound,
                initialPlayers: initialPlayers,
                sortedOrder: sortedOrder,
                scoresHistory: scoresHistory
            };
            connections.forEach(conn => {
                if (conn.open) conn.send(payload);
            });
        }

        function checkModeUI() {
            const t = translations[currentLang] || translations['zh-HK'];

            if (tabId === 'input-panel') {

                document.getElementById('input-panel').classList.add('active');

        function startNewGame() {
            const t = translations[currentLang] || translations['zh-HK'];
            pCount = parseInt(document.getElementById('player-count').value) || 4;

            }
            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('game-play-area').style.display = 'block';

            setupRoundUI();

            saveGameState();

        // 💡 保持房間 ID / QR Code，僅清空分數重新開始
        function restartEntireGame() {
            const t = translations[currentLang] || translations['zh-HK'];
            if (!confirm(t.confirmResetScores)) return;

            scoresHistory = [];
            currentRound = 1;

            sortedOrder = [];
            for (let i = 0; i < pCount; i++) sortedOrder.push(i);

            setupRoundUI();
            renderScoreBoard();
            saveGameState();
            broadcastData();
            alert(t.alertResetDone);
        }

        function getRoundSeatOrder(rd) {
            let dealerIdx = (rd - 1) % pCount;
            let order = [];
            for (let i = 0; i < pCount; i++) order.push((dealerIdx + i) % pCount);
            return order;
        }

        function getScrewPlayerIndexForRound(rd) {
            let dealerIdx = (rd - 1) % pCount;
            return (dealerIdx - 1 + pCount) % pCount;
        }

        function getResultSeatOrder(rd) {
            let screwIdx = getScrewPlayerIndexForRound(rd);
            let order = [];
            for (let i = 0; i < pCount; i++) order.push((screwIdx + i) % pCount);
            return order;
        }

        function getCurrentHandCards() {
            let maxCards = Math.floor(52 / pCount);
            return ((currentRound - 1) % maxCards) + 1;
        }

        function setupRoundUI() {
            const t = translations[currentLang] || translations['zh-HK'];
            let currentHandCards = getCurrentHandCards();
            let dealerIdx = (currentRound - 1) % pCount;
            let screwIdx = getScrewPlayerIndexForRound(currentRound);

            document.getElementById('display-round-title').innerText = t.roundTitleTemplate.replace('{round}', currentRound).replace('{cards}', currentHandCards);
            document.getElementById('display-dealer-name').innerText = t.dealerTipTemplate.replace('{name}', initialPlayers[dealerIdx]);

            let bidSeatOrder = getRoundSeatOrder(currentRound);
            let resultSeatOrder = getResultSeatOrder(currentRound);
            const bidGrid = document.getElementById('grid-bid-inputs');
            const resGrid = document.getElementById('grid-result-inputs');
            bidGrid.innerHTML = ''; resGrid.innerHTML = '';

            bidSeatOrder.forEach((idx) => {
                let name = initialPlayers[idx];
                let isDealer = (idx === dealerIdx), isScrew = (idx === screwIdx);
                let labelTag = isDealer ? t.tagDealer : (isScrew ? t.tagLimit : '');
                let labelClass = isDealer ? 'dealer-highlight' : (isScrew ? 'screw-highlight-txt' : '');
                let inputClass = isDealer ? 'dealer-border' : (isScrew ? 'screw-highlight' : '');

                bidGrid.innerHTML += `<div><div class="player-label ${labelClass}">${name}${labelTag}</div><input type="number" pattern="[0-9]*" class="mobile-input ${inputClass}" id="bid-${idx}" placeholder="0" oninput="onBidInput(${idx})"></div>`;
            });

            resultSeatOrder.forEach((idx) => {
                let name = initialPlayers[idx];
                let isDealer = (idx === dealerIdx), isScrew = (idx === screwIdx);
                let labelTag = isDealer ? t.tagDealer : (isScrew ? t.tagLimit : '');
                let labelClass = isDealer ? 'dealer-highlight' : (isScrew ? 'screw-highlight-txt' : '');
                let inputClass = isDealer ? 'dealer-border' : (isScrew ? 'screw-highlight' : '');

                resGrid.innerHTML += `<div><div class="player-label ${labelClass}">${name}${labelTag}</div><input type="number" pattern="[0-9]*" class="mobile-input ${inputClass}" id="res-${idx}" placeholder="0"></div>`;
            });

            document.getElementById('section-bid').style.opacity = "1";
            document.getElementById('section-bid').style.pointerEvents = "auto";
            document.getElementById('btn-start-round').style.display = "block";
            document.getElementById('section-result').style.opacity = "0.4";
            document.getElementById('section-result').style.pointerEvents = "none";
            document.getElementById('btn-end-round').disabled = true;
        }

        function getBidValue(i) {
            let bVal = document.getElementById(`bid-${i}`).value;
            return bVal === '' ? 0 : parseInt(bVal, 10);
        }

        function getScrewPlayerIndex() {
            return getScrewPlayerIndexForRound(currentRound);
        }

        // 螺絲位不能報令全桌總墩剛好等於本局牌數的那個數字（可爆墩，不可「剛好」）
        function getScrewForbiddenBid() {
            let maxCards = getCurrentHandCards();
            let screwIdx = getScrewPlayerIndex();
            let others = 0;
            for (let i = 0; i < pCount; i++) {
                if (i !== screwIdx) others += getBidValue(i);
            }
            return maxCards - others;
        }

        function onBidInput(playerIdx) {
            const t = translations[currentLang] || translations['zh-HK'];
            let maxCards = getCurrentHandCards();
            let input = document.getElementById(`bid-${playerIdx}`);
            let bidNum = input.value === '' ? 0 : parseInt(input.value, 10);

            if (input.value !== '' && (isNaN(bidNum) || bidNum < 0)) {
                input.value = '';
                return;
            }
            if (bidNum > maxCards) {
                alert(t.alertMaxCardsBid.replace('{maxCards}', maxCards));
                input.value = '';
                return;
            }

            let screwIdx = getScrewPlayerIndex();
            let forbidden = getScrewForbiddenBid();
            let screwInput = document.getElementById(`bid-${screwIdx}`);
            if (!screwInput || screwInput.value === '') return;

            let screwBid = parseInt(screwInput.value, 10);
            if (forbidden >= 0 && forbidden <= maxCards && screwBid === forbidden) {
                alert(t.alertScrewForbidden.replace('{forbidden}', forbidden).replace('{maxCards}', maxCards));
                screwInput.value = '';
            }
        }

        // 💡 報墩邏輯校驗：單人不可超本局牌數；全桌不可剛好等於牌數（可少可爆）
        function lockBids() {
            const t = translations[currentLang] || translations['zh-HK'];
            let maxCards = getCurrentHandCards();
            let totalBid = 0;

            for (let i = 0; i < pCount; i++) {
                let bidNum = getBidValue(i);

                if (bidNum < 0 || isNaN(bidNum)) { alert(t.alertBidsNegative.replace('{name}', initialPlayers[i])); return; }
                if (bidNum > maxCards) { alert(t.alertMaxCardsBid.replace('{maxCards}', maxCards)); return; }
                totalBid += bidNum;
            }

            if (totalBid === maxCards) {
                alert(t.alertTotalBidMatches.replace('{total}', totalBid).replace('{maxCards}', maxCards));
                return;
            }

            document.getElementById('section-bid').style.opacity = "0.4";
            document.getElementById('section-bid').style.pointerEvents = "none";
            document.getElementById('btn-start-round').style.display = "none";
            document.getElementById('section-result').style.opacity = "1";
            document.getElementById('section-result').style.pointerEvents = "auto";
            document.getElementById('btn-end-round').disabled = false;
        }

        // 💡 勝墩邏輯校驗：勝墩總數必須等於總牌數
        function submitResults() {
            const t = translations[currentLang] || translations['zh-HK'];
            let maxCards = getCurrentHandCards();
            let bids = [], results = [], totalResult = 0;

            for (let i = 0; i < pCount; i++) {
                let bVal = document.getElementById(`bid-${i}`).value;
                let rVal = document.getElementById(`res-${i}`).value;

                let bNum = bVal === '' ? 0 : parseInt(bVal);
                let rNum = rVal === '' ? 0 : parseInt(rVal);

                if (rNum < 0) { alert(t.alertResultNegative.replace('{name}', initialPlayers[i])); return; }
                bids.push(bNum);
                results.push(rNum);
                totalResult += rNum;
            }

            if (totalResult !== maxCards) {
                alert(t.alertResultSum.replace('{total}', totalResult).replace('{maxCards}', maxCards));
                return;
            }

            scoresHistory.push({ round: currentRound, bids: bids, results: results });
            recalculateAllScores();
            currentRound++;
            setupRoundUI();
            renderScoreBoard(); // 桌面版即時渲染
            saveGameState();
            broadcastData();
        }

        function recalculateAllScores() {
            let runningTotals = Array(pCount).fill(0);

            scoresHistory.forEach(h => {
                let roundScores = [];
                for (let i = 0; i < pCount; i++) {
                    let b = h.bids[i], r = h.results[i], score = 0;
                    if (b === r) score = 10 + Math.pow(r, 2);
                    else score = -Math.pow(Math.abs(r - b), 2);

                    roundScores.push(score);
                    runningTotals[i] += score;
                }
                h.roundScores = roundScores;
                h.runningTotals = [...runningTotals];
            });

            let tempArr = [];
            for (let i = 0; i < pCount; i++) tempArr.push({ id: i, total: runningTotals[i] });
            tempArr.sort((a, b) => b.total - a.total);
            sortedOrder = tempArr.map(item => item.id);
        }

        function renderScoreBoard() {
            const t = translations[currentLang] || translations['zh-HK'];
            const thr = document.getElementById('board-th-row');
            thr.innerHTML = `<th style="width:70px;">${t.boardRoundCol}</th>`;
            sortedOrder.forEach((pId) => { thr.innerHTML += `<th>${initialPlayers[pId]}</th>`; });

            const tbody = document.getElementById('board-tbody');
            tbody.innerHTML = '';
            if (scoresHistory.length === 0) return;

            scoresHistory.forEach((h, idx) => {
                let editBtnHtml = isReadOnly ? '' : `<button class="edit-round-btn" onclick="openEditModal(${idx})">${t.editModalTitle}</button>`;
                let rowHtml = `<tr><td>${h.round}${editBtnHtml}</td>`;
                sortedOrder.forEach(pId => {
                    rowHtml += `<td>${h.runningTotals[pId]}<br><small style="color:#888;">(${h.bids[pId]}|${h.results[pId]})</small></td>`;
                });
                rowHtml += `</tr>`;
                tbody.innerHTML += rowHtml;
            });
        }

        function openEditModal(roundIdx) {
            const t = translations[currentLang] || translations['zh-HK'];
            editingRoundIndex = roundIdx;
            let record = scoresHistory[roundIdx];
            document.getElementById('edit-modal-title').innerText = `${t.editModalTitle} - ${record.round}`;

            let container = document.getElementById('modal-inputs-area');
            container.innerHTML = '';

            for (let i = 0; i < pCount; i++) {
                container.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:14px;">
                    <span style="width:90px; text-align:left; font-weight:bold;">${initialPlayers[i]}</span>
                    <span>${t.labelBid}: <input type="number" id="edit-bid-${i}" value="${record.bids[i]}" style="width:55px; text-align:center; padding:6px; border-radius:4px; border:1px solid #444; background:#222; color:#fff;"></span>
                    <span>${t.labelResult}: <input type="number" id="edit-res-${i}" value="${record.results[i]}" style="width:55px; text-align:center; padding:6px; border-radius:4px; border:1px solid #444; background:#222; color:#fff;"></span>
                </div>`;
            }
            document.getElementById('edit-modal').style.display = 'block';
        }

        function saveEditedRound() {
            if (editingRoundIndex < 0) return;

            const record = scoresHistory[editingRoundIndex];
            if (!record) return;

            const maxCards = Math.floor(52 / pCount);
            const roundCards = ((record.round - 1) % maxCards) + 1;

            let newBids = [], newResults = [], totalBid = 0, totalResult = 0;
            for (let i = 0; i < pCount; i++) {
                let bVal = document.getElementById(`edit-bid-${i}`).value;
                let rVal = document.getElementById(`edit-res-${i}`).value;
                let bNum = bVal === '' ? 0 : parseInt(bVal, 10);
                let rNum = rVal === '' ? 0 : parseInt(rVal, 10);

                if (isNaN(bNum) || bNum < 0) {
                    alert('報墩不能為負數或空白。');
                    return;
                }
                if (isNaN(rNum) || rNum < 0) {
                    alert('勝墩不能為負數或空白。');
                    return;
                }
                if (bNum > roundCards) {
                    alert(`單人報墩不能超過本局總牌數 (${roundCards} 張)。`);
                    return;
                }

                newBids.push(bNum);
                newResults.push(rNum);
                totalBid += bNum;
                totalResult += rNum;
            }

            if (totalBid === roundCards) {
                alert(`全桌總報墩不能剛好等於本局牌數 (${roundCards} 張)。`);
                return;
            }

            if (totalResult !== roundCards) {
                alert(`全桌實際勝墩總數必須等於本局牌數 (${roundCards} 張)。`);
                return;
            }

            scoresHistory[editingRoundIndex].bids = newBids;
            scoresHistory[editingRoundIndex].results = newResults;

            recalculateAllScores();
            renderScoreBoard();
            saveGameState();
            broadcastData();
            closeEditModal();
            alert(`Round ${scoresHistory[editingRoundIndex].round} updated and synced.`);
        }

        function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }

        function getReadOnlyURL() {
            let baseUrl = window.location.origin + window.location.pathname;
            return `${baseUrl}?mode=view&host=${peer.id}`;

        function showQRCodeModal() {

        function closeQRModal() { document.getElementById('qr-modal').style.display = 'none'; }

        function copyReadOnlyLink() {
            const t = translations[currentLang] || translations['zh-HK'];
            if (!peer || !peer.id) {
                alert(t.peerWaiting);
                return;
            }
            navigator.clipboard.writeText(getReadOnlyURL()).then(() => {
                alert("已複製專屬 P2P 唯讀連結！");
            });
        }

        function resetCurrentRound() { setupRoundUI(); }

        function toggleManagePlayers() {
            const box = document.getElementById('manage-players-box');
            if (box.style.display === 'block') {
                box.style.display = 'none';
            } else {
                box.style.display = 'block';
                renderManagePlayers();

        function renderManagePlayers() {
            const list = document.getElementById('manage-drag-list');
            list.innerHTML = '';
            initialPlayers.forEach((name, i) => {
                list.innerHTML += `
                <div class="drag-item" draggable="true"
                     ondragstart="handleDragStart(event, ${i})"
                     ondragover="handleDragOver(event)"
                     ondrop="handleDrop(event, ${i})">
                    <button type="button" class="seat-btn" onclick="movePlayer(${i}, -1)" ${i === 0 ? 'disabled' : ''}>↑</button>
                    <button type="button" class="seat-btn" onclick="movePlayer(${i}, 1)" ${i === pCount - 1 ? 'disabled' : ''}>↓</button>
                    <input type="text" value="${name.replace(/"/g, '&quot;')}" onchange="renamePlayer(${i}, this.value)">
                    <button type="button" class="delete-p-btn" onclick="deletePlayer(${i})" title="移除玩家">❌</button>
                </div>`;
            });
        }

        function afterRosterChange() {
            pCount = initialPlayers.length;
            if (scoresHistory.length === 0) {
                sortedOrder = [];
                for (let i = 0; i < pCount; i++) sortedOrder.push(i);
            } else {
                recalculateAllScores();
            }
            renderManagePlayers();
            setupRoundUI();
            renderScoreBoard();
            saveGameState();
            broadcastData();
        }

        function swapPlayerSlots(i, j) {
            [initialPlayers[i], initialPlayers[j]] = [initialPlayers[j], initialPlayers[i]];
            scoresHistory.forEach(h => {
                [h.bids[i], h.bids[j]] = [h.bids[j], h.bids[i]];
                [h.results[i], h.results[j]] = [h.results[j], h.results[i]];
            });
        }

        function handleDragStart(e, index) {
            dragSrcIndex = index;
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) { e.preventDefault(); }

        function handleDrop(e, targetIndex) {
            e.preventDefault();
            if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;
            const step = dragSrcIndex < targetIndex ? 1 : -1;
            for (let i = dragSrcIndex; i !== targetIndex; i += step) swapPlayerSlots(i, i + step);
            dragSrcIndex = null;
            afterRosterChange();
        }

        function movePlayer(index, dir) {
            let target = index + dir;
            if (target < 0 || target >= pCount) return;
            swapPlayerSlots(index, target);
            afterRosterChange();
        }

        function renamePlayer(index, newName) {
            let name = (newName || '').trim();
            if (!name) {
                renderManagePlayers();
                return;
            }
            initialPlayers[index] = name;
            setupRoundUI();
            renderScoreBoard();
            saveGameState();
            broadcastData();
        }

        function deletePlayer(index) {
            const t = translations[currentLang] || translations['zh-HK'];
            if (initialPlayers.length <= 2) {
                alert(t.alertNeedAtLeastTwo);
                return;
            }
            if (scoresHistory.length > 0 && !confirm(t.confirmDeletePlayer.replace('{name}', initialPlayers[index]))) return;
            initialPlayers.splice(index, 1);
            scoresHistory.forEach(h => {
                h.bids.splice(index, 1);
                h.results.splice(index, 1);
            });
            afterRosterChange();
        }

        function addNewPlayer() {
            const input = document.getElementById('new-player-name');
            let name = input.value.trim();
            if (!name) return;
            initialPlayers.push(name);
            scoresHistory.forEach(h => {
                h.bids.push(0);
                h.results.push(0);
            });
            input.value = '';
            afterRosterChange();
        }

        function csvCell(value) {
            let s = String(value ?? '');
            if (/[",\n]/.test(s)) s = `"${s.replace(/"/g, '""')}"`;
            return s;
        }

        function exportToExcel() {
            if (scoresHistory.length === 0) {
                alert('尚未有局數記錄可匯出。請先完成至少一局。');
                return;
            }
            let order = sortedOrder.length === pCount ? sortedOrder : [...Array(pCount).keys()];
            let header = ['局'];
            order.forEach((pId, rank) => {
                header.push(`${initialPlayers[pId]} (第${rank + 1}名)`);
            });
            let lines = [header.map(csvCell).join(',')];

            scoresHistory.forEach(h => {
                let row = [h.round];
                order.forEach(pId => {
                    let bid = h.bids[pId] ?? '-';
                    let res = h.results[pId] ?? '-';
                    let tot = h.runningTotals ? h.runningTotals[pId] : '';
                    row.push(`${tot} (${bid}|${res})`);
                });
                lines.push(row.map(csvCell).join(','));
            });

            let last = scoresHistory[scoresHistory.length - 1];
            let totalRow = ['總分數'];
            order.forEach(pId => totalRow.push(last.runningTotals[pId]));
            lines.push(totalRow.map(csvCell).join(','));

            const csvContent = lines.join('\r\n');
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `german_bridge_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>

</html>
