<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>德國橋牌智能計分板 | German Bridge Scoreboard Tool</title>
    <!-- 引入 QR Code 生成套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg-dark: #121212; --surface: #1e1e1e; --primary: #bb86fc; --text-main: #ffffff; --text-muted: #a0a0a0; --border: #2c2c2c; --success: #03dac6; --error: #cf6679; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-size: 16px; padding-bottom: 30px; }
        header { background-color: var(--surface); padding: 15px; text-align: center; border-bottom: 1px solid var(--border); }
        .role-banner { background: #332b15; color: #f1c40f; font-size: 12px; text-align: center; padding: 6px; font-weight: bold; }
        
        .nav-tabs { display: flex; background-color: var(--surface); border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .tab-btn { flex: 1; padding: 15px 0; text-align: center; background: none; border: none; color: var(--text-muted); font-size: 16px; font-weight: bold; cursor: pointer; position: relative; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 3px; background-color: var(--primary); }
        
        .main-container { padding: 16px; display: block; }
        .panel { display: none; }
        .panel.active { display: block; }
        
        .setup-card { background: var(--surface); padding: 16px; border-radius: 8px; margin-bottom: 16px; }
        select, input[type="text"], input[type="number"].setup-input { width: 100%; background: #2d2d2d; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 6px; font-size: 16px; outline: none; }
        .names-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .round-title { font-size: 22px; font-weight: bold; }
        .dealer-tip { font-size: 14px; color: var(--success); background: rgba(3,218,198,0.1); padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        
        .inputs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin-bottom: 15px; }
        .player-label { font-size: 14px; font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
        .player-label.dealer-highlight { color: var(--success); font-weight: bold; }
        .player-label.screw-highlight-txt { color: #f1c40f; font-weight: bold; }
        
        input[type="number"].mobile-input { width: 100%; background: #252525; border: 1px solid var(--border); color: white; text-align: center; padding: 15px 0; font-size: 20px; font-weight: bold; border-radius: 8px; }
        input[type="number"].dealer-border { border-color: var(--success) !important; background: #162a27; }
        input[type="number"].screw-highlight { border-color: #f1c40f !important; background: #332b15; }
        
        .action-btn { width: 100%; background-color: var(--primary); color: #000; padding: 16px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 10px 0; }
        .action-btn:disabled { background-color: #444; color: #888; }
        .action-btn.btn-secondary { background-color: #333; color: #fff; border: 1px solid #444; }
        .action-btn.btn-warning { background-color: #f39c12; color: #000; }
        .action-btn.btn-success { background-color: var(--success); color: #000; }
        
        .table-responsive-wrapper { width: 100%; overflow-x: auto; max-height: 75vh; } 
        .score-board-table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: center; }
        .score-board-table th { position: sticky; top: 0; background: #1e1e1e; color: var(--text-muted); padding: 14px 6px; font-size: 13px; border-bottom: 2px solid var(--border); z-index: 10; }
        .score-board-table td { padding: 14px 4px; font-size: 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
        
        .edit-round-btn { background: #333; color: var(--primary); border: 1px solid var(--primary); padding: 2px 6px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-left: 4px; }
        
        /* Modal 通用樣式 */
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); }
        .modal-content { background: var(--surface); margin: 15% auto; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; }
        #qrcode-box { display: flex; justify-content: center; margin: 20px 0; background: white; padding: 15px; border-radius: 8px; }

        @media (min-width: 850px) {
            .nav-tabs { display: none !important; }
            .main-container { display: flex; gap: 25px; max-width: 1400px; margin: 0 auto; padding: 25px; }
            .panel { display: block !important; flex: 1; background: var(--surface); padding: 25px; border-radius: 12px; }
            #input-panel { flex: 1.2; }
            #board-panel { flex: 1.8; }
        }
    </style>
</head>
<body>

    <header>
        <h1>德國橋牌智能計分系統</h1>
    </header>
    <div id="role-notice" class="role-banner">🔑 權限：管理員模式（可輸入/修改分數）</div>

    <div class="nav-tabs">
        <button class="tab-btn active" id="btn-input" onclick="switchTab('input-panel')">輸入</button>
        <button class="tab-btn" id="btn-board" onclick="switchTab('board-panel')">積分板</button>
    </div>

    <div class="main-container">
        <!-- 第一板：輸入 panel -->
        <div id="input-panel" class="panel active">
            <div class="setup-card" id="setup-area">
                <div class="form-group">
                    <label>選擇人數</label>
                    <input type="number" id="player-count" class="setup-input" value="4" min="2" max="52" oninput="initPlayerInputs()">
                </div>
                <label>玩家名字 (順時針座位)</label>
                <div class="names-grid" id="names-fields-box"></div>
                <button class="action-btn" onclick="startNewGame()">建立新對局</button>
            </div>

            <div id="game-play-area" style="display: none;">
                <div class="game-header">
                    <div class="round-title" id="display-round-title">局 1</div>
                    <div class="dealer-tip" id="display-dealer-name">👑 莊家: --</div>
                </div>

                <div id="section-bid">
                    <div style="color:var(--text-muted); font-size:14px; margin-bottom:8px;">預計取得墩數 (Bid) <span id="screw-notice" style="color:#f1c40f;"></span></div>
                    <div class="inputs-grid" id="grid-bid-inputs"></div>
                    <button class="action-btn" id="btn-start-round" onclick="lockBids()">開始本局</button>
                </div>

                <div id="section-result" style="opacity: 0.4; pointer-events: none;">
                    <div style="color:var(--text-muted); font-size:14px; margin-bottom:8px;">實際贏取墩數 (Result)</div>
                    <div class="inputs-grid" id="grid-result-inputs"></div>
                    <button class="action-btn" id="btn-end-round" onclick="submitResults()" disabled>結束本局</button>
                </div>
                <button class="action-btn btn-warning" onclick="resetCurrentRound()">↩️ 重設本局輸入</button>
            </div>
        </div>

        <!-- 第二板：積分板 panel -->
        <div id="board-panel" class="panel">
            <div id="admin-tools" style="margin-bottom:12px; display:flex; gap:8px;">
                <button class="action-btn btn-secondary" style="padding:10px; font-size:13px; margin:0;" onclick="showQRCodeModal()">📱 顯示唯讀 QR Code</button>
                <button class="action-btn btn-secondary" style="padding:10px; font-size:13px; margin:0;" onclick="copyReadOnlyLink()">🔗 複製唯讀連結</button>
            </div>
            <div class="table-responsive-wrapper">
                <table class="score-board-table">
                    <thead><tr id="board-th-row"><th style="width:50px;">局</th></tr></thead>
                    <tbody id="board-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 彈窗 1：修改分數 Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3 id="edit-modal-title" style="margin-bottom:15px; color:var(--primary);">修改第 X 局記錄</h3>
            <div id="modal-inputs-area"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="action-btn btn-success" style="margin:0;" onclick="saveEditedRound()">儲存並重算</button>
                <button class="action-btn btn-secondary" style="margin:0;" onclick="closeEditModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- 彈窗 2：顯示唯讀 QR Code Modal -->
    <div id="qr-modal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--primary);">玩家唯讀觀看 QR Code</h3>
            <p style="font-size:12px; color:var(--text-muted); margin-top:5px;">請讓其他玩家用手機掃描以下 QR Code，即可在個人手機即時觀看分數板。</p>
            <div id="qrcode-box"></div>
            <button class="action-btn btn-secondary" style="margin:0;" onclick="closeQRModal()">關閉</button>
        </div>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const isReadOnly = urlParams.get('mode') === 'view';

    let pCount = 4, currentRound = 1;
    let initialPlayers = [], sortedOrder = [], scoresHistory = [];
    let editingRoundIndex = -1;
    let qrCodeInstance = null;

    window.onload = function() {
        initPlayerInputs();
        checkModeUI();
        checkLocalStorageLoad();
    };

    function checkModeUI() {
        if (isReadOnly) {
            document.getElementById('role-notice').innerText = "👀 權限：玩家唯讀模式（僅供觀看，無法改分）";
            document.getElementById('role-notice').style.background = "#1a2634";
            document.getElementById('role-notice').style.color = "#3498db";
            document.getElementById('input-panel').style.display = "none";
            document.getElementById('btn-input').style.display = "none";
            document.getElementById('admin-tools').style.display = "none";
            switchTab('board-panel');
        }
    }

    function switchTab(tabId) {
        document.getElementById('btn-input').classList.remove('active');
        document.getElementById('btn-board').classList.remove('active');
        document.getElementById('input-panel').classList.remove('active');
        document.getElementById('board-panel').classList.remove('active');

        if(tabId === 'input-panel') {
            document.getElementById('btn-input').classList.add('active');
            document.getElementById('input-panel').classList.add('active');
        } else {
            document.getElementById('btn-board').classList.add('active');
            document.getElementById('board-panel').classList.add('active');
            renderScoreBoard();
        }
    }

    function initPlayerInputs() {
        pCount = parseInt(document.getElementById('player-count').value) || 4;
        const box = document.getElementById('names-fields-box');
        box.innerHTML = '';
        for(let i=0; i<pCount; i++) {
            box.innerHTML += `<input type="text" id="p-name-in-${i}" value="玩家 ${String.fromCharCode(65 + i)}">`;
        }
    }

    function startNewGame() {
        pCount = parseInt(document.getElementById('player-count').value) || 4;
        initialPlayers = []; sortedOrder = []; scoresHistory = []; currentRound = 1;
        for(let i=0; i<pCount; i++) {
            let name = document.getElementById(`p-name-in-${i}`).value.trim();
            initialPlayers.push(name || `玩家 ${String.fromCharCode(65 + i)}`);
            sortedOrder.push(i);
        }
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('game-play-area').style.display = 'block';
        saveAndSync();
        setupRoundUI();
        renderScoreBoard();
    }

    function getRoundSeatOrder(rd) {
        let dealerIdx = (rd - 1) % pCount;
        let order = [];
        for (let i = 0; i < pCount; i++) order.push((dealerIdx + i) % pCount);
        return order;
    }

    function setupRoundUI() {
        let maxCards = Math.floor(52 / pCount);
        let currentHandCards = ((currentRound - 1) % maxCards) + 1;
        let dealerIdx = (currentRound - 1) % pCount;
        let screwIdx = (dealerIdx - 1 + pCount) % pCount;

        document.getElementById('display-round-title').innerText = `局 ${currentRound} (發 ${currentHandCards} 張)`;
        document.getElementById('display-dealer-name').innerText = `👑 莊家: ${initialPlayers[dealerIdx]}`;

        let seatOrder = getRoundSeatOrder(currentRound);
        const bidGrid = document.getElementById('grid-bid-inputs');
        const resGrid = document.getElementById('grid-result-inputs');
        bidGrid.innerHTML = ''; resGrid.innerHTML = '';

        seatOrder.forEach((idx) => {
            let name = initialPlayers[idx];
            let isDealer = (idx === dealerIdx), isScrew = (idx === screwIdx);
            let labelTag = isDealer ? ' (莊)' : (isScrew ? ' (🎯)' : '');
            let labelClass = isDealer ? 'dealer-highlight' : (isScrew ? 'screw-highlight-txt' : '');
            let inputClass = isDealer ? 'dealer-border' : (isScrew ? 'screw-highlight' : '');

            bidGrid.innerHTML += `<div><div class="player-label ${labelClass}">${name}${labelTag}</div><input type="number" pattern="[0-9]*" class="mobile-input ${inputClass}" id="bid-${idx}"></div>`;
            resGrid.innerHTML += `<div><div class="player-label ${labelClass}">${name}${labelTag}</div><input type="number" pattern="[0-9]*" class="mobile-input ${inputClass}" id="res-${idx}"></div>`;
        });

        document.getElementById('section-bid').style.opacity = "1";
        document.getElementById('section-bid').style.pointerEvents = "auto";
        document.getElementById('btn-start-round').style.display = "block";
        document.getElementById('section-result').style.opacity = "0.4";
        document.getElementById('section-result').style.pointerEvents = "none";
        document.getElementById('btn-end-round').disabled = true;
    }

    function lockBids() {
        for(let i=0; i<pCount; i++) {
            if(document.getElementById(`bid-${i}`).value === '') { alert("請填寫所有 Bid！"); return; }
        }
        document.getElementById('section-bid').style.opacity = "0.4";
        document.getElementById('section-bid').style.pointerEvents = "none";
        document.getElementById('btn-start-round').style.display = "none";
        document.getElementById('section-result').style.opacity = "1";
        document.getElementById('section-result').style.pointerEvents = "auto";
        document.getElementById('btn-end-round').disabled = false;
    }

    function submitResults() {
        let bids = [], results = [];
        for(let i=0; i<pCount; i++) {
            let rVal = document.getElementById(`res-${i}`).value;
            if(rVal === '') { alert("請填寫所有 Result！"); return; }
            bids.push(parseInt(document.getElementById(`bid-${i}`).value));
            results.push(parseInt(rVal));
        }

        scoresHistory.push({ round: currentRound, bids: bids, results: results });
        recalculateAllScores();
        currentRound++;
        saveAndSync();
        setupRoundUI();
    }

    function recalculateAllScores() {
        let runningTotals = Array(pCount).fill(0);

        scoresHistory.forEach(h => {
            let roundScores = [];
            for(let i=0; i<pCount; i++) {
                let b = h.bids[i], r = h.results[i], score = 0;
                if(b === r) score = 10 + Math.pow(r, 2);
                else score = -Math.pow(Math.abs(r - b), 2);
                
                roundScores.push(score);
                runningTotals[i] += score;
            }
            h.roundScores = roundScores;
            h.runningTotals = [...runningTotals];
        });

        let tempArr = [];
        for(let i=0; i<pCount; i++) tempArr.push({ id: i, total: runningTotals[i] });
        tempArr.sort((a, b) => b.total - a.total);
        sortedOrder = tempArr.map(item => item.id);
    }

    function renderScoreBoard() {
        const thr = document.getElementById('board-th-row');
        thr.innerHTML = `<th style="width:70px;">局</th>`;
        sortedOrder.forEach((pId) => { thr.innerHTML += `<th>${initialPlayers[pId]}</th>`; });

        const tbody = document.getElementById('board-tbody');
        tbody.innerHTML = '';
        if(scoresHistory.length === 0) return;

        scoresHistory.forEach((h, idx) => {
            let editBtnHtml = isReadOnly ? '' : `<button class="edit-round-btn" onclick="openEditModal(${idx})">改</button>`;
            let rowHtml = `<tr><td>${h.round}${editBtnHtml}</td>`;
            sortedOrder.forEach(pId => {
                rowHtml += `<td>${h.runningTotals[pId]}<br><small style="color:#888;">(${h.bids[pId]}|${h.results[pId]})</small></td>`;
            });
            rowHtml += `</tr>`;
            tbody.innerHTML += rowHtml;
        });
    }

    // 🌟 顯示/產生 QR Code Modal
    function showQRCodeModal() {
        let viewUrl = window.location.origin + window.location.pathname + "?mode=view";
        let box = document.getElementById('qrcode-box');
        box.innerHTML = ''; 

        qrCodeInstance = new QRCode(box, {
            text: viewUrl,
            width: 200,
            height: 200
        });

        document.getElementById('qr-modal').style.display = 'block';
    }

    function closeQRModal() { document.getElementById('qr-modal').style.display = 'none'; }

    function copyReadOnlyLink() {
        let viewUrl = window.location.origin + window.location.pathname + "?mode=view";
        navigator.clipboard.writeText(viewUrl).then(() => {
            alert("已複製「唯讀連結」！貼給朋友開啟後便能即時睇分！");
        });
    }

    function openEditModal(roundIdx) {
        editingRoundIndex = roundIdx;
        let record = scoresHistory[roundIdx];
        document.getElementById('edit-modal-title').innerText = `修改第 ${record.round} 局分數`;
        
        let container = document.getElementById('modal-inputs-area');
        container.innerHTML = '';
        
        for(let i=0; i<pCount; i++) {
            container.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <span style="width:100px;">${initialPlayers[i]}</span>
                    Bid: <input type="number" id="edit-bid-${i}" value="${record.bids[i]}" style="width:60px; text-align:center;">
                    Res: <input type="number" id="edit-res-${i}" value="${record.results[i]}" style="width:60px; text-align:center;">
                </div>`;
        }
        document.getElementById('edit-modal').style.display = 'block';
    }

    function saveEditedRound() {
        if(editingRoundIndex < 0) return;
        let newBids = [], newResults = [];
        for(let i=0; i<pCount; i++) {
            newBids.push(parseInt(document.getElementById(`edit-bid-${i}`).value) || 0);
            newResults.push(parseInt(document.getElementById(`edit-res-${i}`).value) || 0);
        }
        
        scoresHistory[editingRoundIndex].bids = newBids;
        scoresHistory[editingRoundIndex].results = newResults;
        
        recalculateAllScores();
        saveAndSync();
        renderScoreBoard();
        closeEditModal();
        alert("第 " + scoresHistory[editingRoundIndex].round + " 局已更新！");
    }

    function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }

    function saveAndSync() {
        localStorage.setItem('gb_pCount', pCount);
        localStorage.setItem('gb_currentRound', currentRound);
        localStorage.setItem('gb_initialPlayers', JSON.stringify(initialPlayers));
        localStorage.setItem('gb_sortedOrder', JSON.stringify(sortedOrder));
        localStorage.setItem('gb_scoresHistory', JSON.stringify(scoresHistory));
    }

    function checkLocalStorageLoad() {
        let savedHistory = localStorage.getItem('gb_scoresHistory');
        if (savedHistory && JSON.parse(savedHistory).length > 0) {
            scoresHistory = JSON.parse(savedHistory);
            pCount = parseInt(localStorage.getItem('gb_pCount'));
            currentRound = parseInt(localStorage.getItem('gb_currentRound'));
            initialPlayers = JSON.parse(localStorage.getItem('gb_initialPlayers'));
            sortedOrder = JSON.parse(localStorage.getItem('gb_sortedOrder'));

            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('game-play-area').style.display = 'block';
            setupRoundUI();
            renderScoreBoard();
        }
    }

    function resetCurrentRound() { setupRoundUI(); }
</script>
</body>
</html>
